name: iOS Build & TestFlight Distribution

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-build-testflight.yml'
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build NexusCompanion iOS & TestFlight
    runs-on: macos-14

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Xcode Environment
        run: |
          echo "=== Installed Xcode Versions ==="
          ls -d /Applications/Xcode*
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: 3. Validate Xcode Project & Schemes
        run: |
          cd apps/ios
          xcodebuild -project NexusCompanion.xcodeproj -list
          xcodebuild -project NexusCompanion.xcodeproj -target NexusCompanion -showBuildSettings | grep -E "(PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|SWIFT_VERSION)"

      - name: 4. Configure Apple Code Signing (If Secrets Configured)
        id: setup-signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISION_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'nexus_temp_keychain_123' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Apple Developer signing secrets detected. Installing keychain and provisioning profile..."
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
            echo "has_signing=true" >> $GITHUB_OUTPUT
          else
            echo "No Apple Developer secrets configured. Building unsigned archive for compilation verification."
            echo "has_signing=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$APPSTORE_KEY_ID" ]; then
            echo "has_appstore_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_appstore_key=false" >> $GITHUB_OUTPUT
          fi

      - name: 5. Build and Archive NexusCompanion (.xcarchive)
        run: |
          mkdir -p build
          if [ "${{ steps.setup-signing.outputs.has_signing }}" = "true" ]; then
            xcodebuild archive \
              -project apps/ios/NexusCompanion.xcodeproj \
              -scheme NexusCompanion \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/NexusCompanion.xcarchive \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}"
          else
            xcodebuild archive \
              -project apps/ios/NexusCompanion.xcodeproj \
              -scheme NexusCompanion \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/NexusCompanion.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: 6. Inspect & Verify Generated .xcarchive
        run: |
          echo "=== Archive Inspection ==="
          ls -la build/NexusCompanion.xcarchive
          ls -la build/NexusCompanion.xcarchive/Products/Applications/
          APP_PATH="build/NexusCompanion.xcarchive/Products/Applications/NexusCompanion.app"
          if [ -d "$APP_PATH" ]; then
            echo "[SUCCESS] Valid Mach-O binary compiled:"
            file "$APP_PATH/NexusCompanion"
            echo "=== App Bundle Contents ==="
            ls -la "$APP_PATH"
          else
            echo "[FAIL] NexusCompanion.app not found in archive!"
            exit 1
          fi

      - name: 7. Export IPA Package
        if: steps.setup-signing.outputs.has_signing == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/NexusCompanion.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist apps/ios/ExportOptions.plist
          echo "=== Generated IPA Files ==="
          ls -la build/ipa/

      - name: 8. Upload to Apple TestFlight (App Store Connect API)
        if: steps.setup-signing.outputs.has_appstore_key == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}


        run: |
          echo "Setting up App Store Connect API Key..."
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_PRIVATE_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

          IPA_PATH=$(find build/ipa -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_PATH to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: 9. Upload Build Artifacts to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: NexusCompanion-iOS-Build
          path: |
            build/NexusCompanion.xcarchive
            build/ipa/*.ipa
          if-no-files-found: warn
