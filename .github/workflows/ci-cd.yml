name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Backend Dependencies & Verify Code Quality
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pytest requests fastapi uvicorn sqlalchemy pydantic
          ruff check --select F,E,W,I backend/
          pyright backend/

      - name: Install Frontend Dependencies & Verify TypeScript & Build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
