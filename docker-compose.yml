version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nexus_admin:NexusSecurePass2026!@postgres:5432/nexus_voice_os
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=nexus_super_secret_jwt_key_32_bytes_min_length_123456
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: NexusSecurePass2026!
      POSTGRES_DB: nexus_voice_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
