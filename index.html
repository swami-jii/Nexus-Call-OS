<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Call OS</title>
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Create Call OS" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sacramento&family=Satisfy&display=swap" rel="stylesheet" />
    <script>
      // Automatic Tunnel Bypass Setup for Ngrok / Public Gateway
      (function() {
        try {
          if (window.location.hostname.includes('ngrok')) {
            document.cookie = "ngrok-skip-browser-warning=true; path=/; max-age=31536000; SameSite=None; Secure";
          }
        } catch (e) {}
      })();

      // Diagnostic Global Error Catcher
      window.addEventListener('error', function(e) {
        console.error('GLOBAL_ERROR_CAPTURED:', e);
        var errBox = document.getElementById('global-error-banner');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'global-error-banner';
          errBox.style.cssText = 'position:fixed;top:20px;left:20px;right:20px;background:#7f1d1d;color:#fee2e2;padding:20px;border-radius:12px;z-index:999999;font-family:sans-serif;font-size:14px;border:1px solid #ef4444;box-shadow:0 10px 30px rgba(0,0,0,0.8);line-height:1.5;';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML = '<strong style="font-size:16px;color:#ffffff;">Application Script Error:</strong><br/><div style="margin-top:8px;font-family:monospace;background:#450a0a;padding:10px;border-radius:6px;word-break:break-all;">' + (e.message || 'Unknown error') + '</div><div style="margin-top:8px;font-size:12px;opacity:0.8;">' + (e.filename || '') + ':' + (e.lineno || '') + '</div><button onclick="window.location.reload()" style="margin-top:12px;padding:6px 14px;background:#ef4444;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">Reload Page</button>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('UNHANDLED_REJECTION_CAPTURED:', e);
      });
    </script>
    <style>
      html, body {
        background-color: #09090b;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #09090b;
        color: #f4f4f5;
        font-family: 'Inter', -apple-system, sans-serif;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .loader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(16, 185, 129, 0.15);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased">
    <div id="initial-loader">
      <div class="loader-spinner"></div>
      <p style="margin-top: 14px; font-size: 13px; font-weight: 600; color: #a1a1aa; letter-spacing: -0.01em;">Connecting to Create Call OS...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var dismissed = false;
        function dismissLoader() {
          if (dismissed) return;
          dismissed = true;
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.transition = 'opacity 0.25s ease, visibility 0.25s ease';
            loader.style.opacity = '0';
            loader.style.pointerEvents = 'none';
            setTimeout(function() {
              if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 300);
          }
        }
        window.__dismissInitialLoader = dismissLoader;

        // 1. Immediate check if root already contains rendered markup
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          dismissLoader();
        }

        // 2. Mutation observer for dynamic React mounting
        if (root && window.MutationObserver) {
          var observer = new MutationObserver(function() {
            if (root.children.length > 0) {
              dismissLoader();
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
        }

        // 3. Fallback safety timer (dismiss after 4000ms max in case of stalled network)
        setTimeout(dismissLoader, 4000);

        // 4. Window load listener fallback
        window.addEventListener('load', function() {
          if (root && root.children.length > 0) {
            dismissLoader();
          }
        });
      })();
    </script>
  </body>
</html>
